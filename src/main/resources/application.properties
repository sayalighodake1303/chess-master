# ===================================================================
# Chess Master Application Configuration
# ===================================================================
server.port=8080
spring.application.name=chess-master

# -------------------------------------------------------------------
# Database Configuration (H2 In-Memory - Works out-of-the-box!)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:chessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# MySQL Configuration (Uncomment to switch to MySQL)
# -------------------------------------------------------------------
